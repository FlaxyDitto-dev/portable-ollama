<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable Ollama WebUI</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        /* white-space: pre-wrap ensures line breaks and paragraphs format correctly */
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
        .user { background: #2c2c2c; align-self: flex-end; margin-left: auto; color: white; }
        .ai { background: #3d3d3d; border-left: 4px solid #007bff; color: #e0e0e0; }
        .input-area { padding: 20px; background: #252525; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 4px; background: #333; color: white; font-size: 16px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { font-size: 12px; padding: 8px 20px; color: #aaa; background: #111; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="status">Status: Ready to chat</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="model" placeholder="Model (e.g. qwen3:0.6b)" value="qwen3:0.6b" style="flex: 0.2;">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('userInput');
            const model = document.getElementById('model').value;
            const chat = document.getElementById('chat');
            const btn = document.getElementById('sendBtn');
            
            if (!input.value.trim()) return;

            const userMsg = input.value;
            
            // 1. Display User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.textContent = userMsg;
            chat.appendChild(userDiv);
            
            // Disable input while generating
            input.value = '';
            btn.disabled = true;

            // 2. Create the AI Message box (empty at first)
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai';
            chat.appendChild(aiDiv);
            chat.scrollTop = chat.scrollHeight;

            try {
                // Changed from localhost to 127.0.0.1 to fix Windows routing issues!
                // stream: true is now enabled
                const response = await fetch('http://127.0.0.1:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: model, prompt: userMsg, stream: true })
                });

                if (!response.ok) throw new Error("Connection failed");

                // 3. Read the stream chunk by chunk
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    
                    // The API sends multiple JSON objects separated by newlines
                    const lines = chunk.split('\n').filter(line => line.trim() !== '');

                    for (const line of lines) {
                        const data = JSON.parse(line);
                        // Append text securely as it streams in
                        aiDiv.textContent += data.response;
                        // Auto-scroll to the bottom as text appears
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            } catch (err) {
                aiDiv.textContent = "Error: Cannot connect to Ollama. Make sure the server script is running in the background!";
                aiDiv.style.color = "#ff6b6b";
            } finally {
                // Re-enable the send button when finished
                btn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
